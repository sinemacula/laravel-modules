# Reference: https://qlty.sh/d/qlty-toml
#
# Code-quality configuration for both the Qlty CLI and Qlty Cloud. Lint and
# format rules come from the shared sinemacula/coding-standards source; this
# file wires that source in and selects the plugins relevant to a PHP
# repository.
config_version = "0"

exclude_patterns = [
    "*_min.*",
    "*-min.*",
    "*.min.*",
    "**/build/**",
    "**/cache/**",
    "**/coverage/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/vendor/**",
    ".qlty/configs/**",
    ".sinemacula/**",
]

test_patterns = [
    "**/test/**",
    "**/tests/**",
    "**/spec/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/test_*.*",
    "**/spec_*.*",
]

[runtimes.enabled]
php = "8.3"

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[source]]
name = "sinemacula"
repository = "https://github.com/sinemacula/coding-standards"
tag = "v1.20.2"

[[plugin]]
name = "actionlint"

[[plugin]]
name = "editorconfig-checker"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "php-codesniffer"
version = "4.0.1"
mode = "comment"
package_file = "composer.json"
package_filters = ["slevomat", "dealerdirect", "sinemacula"]

# Pinned to the last php-cs-fixer release whose symfony/console stays on the 7.x
# line. 3.90+ pulls symfony/console 8 (requires PHP 8.4.1 and uses 8.4-only
# syntax), which qlty's PHP 8.3 runner cannot parse. Bump once the runner ships
# PHP 8.4.
[[plugin]]
name = "php-cs-fixer"
package_file = "composer.json"
package_filters = ["sinemacula"]
version = "3.89.0"

[[plugin]]
name = "phpstan"
version = "2.1.46"

[[plugin]]
name = "radarlint-php"
mode = "comment"

[[plugin]]
name = "trivy"
drivers = [
    "config",
    "fs-vuln",
]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "yamllint"

# phpstan + larastan need the project's dependencies installed so larastan can
# bootstrap the application and resolve framework symbols. package_file alone
# does not run a full install, so install them via a prepare script. composer
# install resolves from composer.json when no lockfile is committed (this is a
# library, so composer.lock is not tracked). Ignore only extension reqs (qlty's
# runner may lack some) but NOT the PHP version: a blanket --ignore-platform-reqs
# lets the PHP 8.3 runner pull symfony 8 (8.4-only syntax) and larastan's
# bootstrap then dies. Do not remove.
[plugins.definitions.phpstan.drivers.lint]
prepare_script = "~/.qlty/cache/tools/composer/generic-42cc848a9f5e/composer.phar install --no-scripts --ignore-platform-req='ext-*'"

# php-codesniffer 4.x exits with code 3 when it finds issues; qlty's default
# success codes are [0, 1], so without this qlty treats a normal "issues found"
# run as a hard failure and silently drops every phpcs finding (false green).
# This must live here in the consumer's qlty.toml - a qlty bug drops all of a
# source's exported configs if the block is placed in the shared source.toml.
[plugins.definitions.php-codesniffer.drivers.lint]
success_codes = [0, 1, 2, 3]

# Skip radarlint smell analysis on the test and benchmark trees. Reused fixture
# literals, multi-branch data providers, and benchmark subjects that share a body
# but differ only in their setup/attributes trip duplication and return-count
# rules without value.
[[exclude]]
plugins = ["radarlint-php"]
file_patterns = ["benchmarks/**", "tests/**"]
